# ROS <-> Gazebo bridge mapping for the roboworks Ackermann model.
#
# This is based on the thesis navigation setup (ackermann_thesis/config/minimal_bridge.yaml).

# Nav2 publishes /cmd_vel; delivery_stack AckermannSafetyController reads /cmd_vel and
# republishes here so Gazebo gets a single commanded stream (avoids two publishers on /cmd_vel).
- ros_topic_name: "/cmd_vel_safe"
  gz_topic_name: "/model/roboworks/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom_combined"
  gz_topic_name: "/model/roboworks/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

